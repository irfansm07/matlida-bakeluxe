    // --- AUDIO CHIME SYNTHESIZER ---
    let audioCtx = null;
    let soundEnabled = true;

    function playSweetChime() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const notes = [1046.50, 1318.51, 1567.98, 1975.53]; // C6, E6, G6, B6
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0, now + idx * 0.05);
          gain.gain.linearRampToValueAtTime(0.08, now + idx * 0.05 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.05 + 0.9);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.95);
        });
      } catch (e) {}
    }

    // Soft liquid chocolate droplet sound (Web Audio API)
    function playDripSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(550, now);
        osc.frequency.exponentialRampToValueAtTime(1150, now + 0.09);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.095);
      } catch (e) {}
    }

    // --- RECREATED EXACT MATILDA CREST LOGO ---

    // --- INTERACTIVE MOLTEN CHOCOLATE DRIP & CONTINUOUS FALLING DROPLETS ENGINE ---
    function MoltenChocolateDripSystem({ onDropCountChange }) {
      const canvasRef = useRef(null);
      const [dropsStacked, setDropsStacked] = useState(12); // starts with 12 stacked
      const [badgeBottom, setBadgeBottom] = useState(16);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animId;
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        const onResize = () => {
          if (!canvas) return;
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
          updateBadgePos();
        };
        window.addEventListener('resize', onResize);

        const getHeaderBottom = () => {
          const header = document.querySelector('header');
          if (header) {
            const rect = header.getBoundingClientRect();
            return Math.max(0, rect.bottom);
          }
          return 86;
        };

        const getFooterTop = () => {
          const footer = document.getElementById('site-footer') || document.querySelector('footer');
          if (footer) {
            const rect = footer.getBoundingClientRect();
            return rect.top;
          }
          return h;
        };

        const updateBadgePos = () => {
          const footer = document.getElementById('site-footer') || document.querySelector('footer');
          if (footer) {
            const rect = footer.getBoundingClientRect();
            const winH = window.innerHeight;
            if (rect.top < winH) {
              // Footer is in view; keep badge 22px above footer top so it never overlaps
              setBadgeBottom(Math.max(16, winH - rect.top + 22));
            } else {
              setBadgeBottom(16);
            }
          }
        };
        window.addEventListener('scroll', updateBadgePos, { passive: true });
        updateBadgePos();

        // Active droplet state
        let drop = {
          state: 'forming', // forming, falling
          t: 0,
          x: 52,
          y: 150,
          vy: 1.8,
          radius: 3,
          stretchY: 0
        };

        // Ripples upon hitting the bottom
        let ripples = [];
        let poolHeight = 32; // initial baseline pool at bottom
        let time = 0;

        const render = () => {
          ctx.clearRect(0, 0, w, h);
          time += 0.035;

          const topY = getHeaderBottom();
          const isMobile = w < 640;
          const scale = isMobile ? 0.52 : 1.0;
          const dripOrigin = { x: Math.round(52 * scale), y: topY + Math.round(65 * scale) };
          const footerTop = getFooterTop();
          const isFooterInView = footerTop <= h + 80;
          const currentFloor = isFooterInView ? (footerTop - poolHeight * 0.5) : (h + 30);

          // 1. TOP-LEFT HANGING MOLTEN CHOCOLATE MASS (Clinging directly below Header)
          ctx.save();
          ctx.translate(0, topY);
          ctx.scale(scale, scale);

          const chocGrad = ctx.createLinearGradient(0, 0, 260, 90);
          chocGrad.addColorStop(0, '#190803');
          chocGrad.addColorStop(0.35, '#35160A');
          chocGrad.addColorStop(0.75, '#220D05');
          chocGrad.addColorStop(1, '#110502');

          ctx.fillStyle = chocGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(290, 0);
          ctx.bezierCurveTo(260, 18, 230, 28, 210, 28);
          ctx.bezierCurveTo(190, 28, 175, 56, 155, 56);
          ctx.bezierCurveTo(140, 56, 130, 20, 110, 20);
          ctx.bezierCurveTo(95, 20, 85, 46, 72, 46);
          // Main Long Drip hanging down to relative tip (52, 65)
          ctx.bezierCurveTo(64, 46, 58, 56, 52, 65);
          ctx.bezierCurveTo(46, 56, 38, 36, 22, 36);
          ctx.bezierCurveTo(10, 36, 5, 52, 0, 62);
          ctx.closePath();
          ctx.fill();

          // Gloss Specular Highlight Line along bottom edge of drip
          ctx.strokeStyle = '#8A4A25';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, 2);
          ctx.lineTo(280, 2);
          ctx.bezierCurveTo(252, 19, 225, 29, 208, 29);
          ctx.bezierCurveTo(188, 29, 173, 57, 153, 57);
          ctx.bezierCurveTo(138, 57, 128, 21, 108, 21);
          ctx.bezierCurveTo(93, 21, 83, 47, 70, 47);
          ctx.bezierCurveTo(62, 47, 56, 57, 52, 65);
          ctx.stroke();

          // Amber gold sparkle on the drip curve
          ctx.fillStyle = '#E8BF6D';
          ctx.beginPath();
          ctx.ellipse(52, 61, 3.5, 1.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 2. DROPLET FORMING & FALLING CYCLE
          if (drop.state === 'forming') {
            drop.x = dripOrigin.x;
            drop.t += 0.012; // Slow, realistic viscous formation (~2.2 seconds)
            drop.radius = 3 + drop.t * 5.5; // grows up to 8.5px
            drop.stretchY = Math.pow(drop.t, 2.2) * 26; // viscous stretching downward

            // Draw elastic connecting neck
            ctx.save();
            ctx.fillStyle = '#281107';
            ctx.beginPath();
            ctx.moveTo(dripOrigin.x - 3 * (1 - drop.t * 0.4), dripOrigin.y);
            ctx.quadraticCurveTo(
              dripOrigin.x, dripOrigin.y + drop.stretchY * 0.5,
              dripOrigin.x - drop.radius * 0.85, dripOrigin.y + drop.stretchY
            );
            ctx.arc(dripOrigin.x, dripOrigin.y + drop.stretchY, drop.radius, Math.PI, 0, true);
            ctx.quadraticCurveTo(
              dripOrigin.x, dripOrigin.y + drop.stretchY * 0.5,
              dripOrigin.x + 3 * (1 - drop.t * 0.4), dripOrigin.y
            );
            ctx.fill();

            // Shiny specular highlight on forming droplet
            ctx.fillStyle = 'rgba(255, 235, 185, 0.85)';
            ctx.beginPath();
            ctx.arc(
              dripOrigin.x - drop.radius * 0.35,
              dripOrigin.y + drop.stretchY - drop.radius * 0.25,
              drop.radius * 0.28,
              0, Math.PI * 2
            );
            ctx.fill();
            ctx.restore();

            // When fully stretched, snap neck and fall!
            if (drop.t >= 1) {
              drop.state = 'falling';
              drop.y = dripOrigin.y + drop.stretchY;
              drop.vy = 2.2;
            }
          } else if (drop.state === 'falling') {
            drop.vy += 0.42; // viscous gravity acceleration
            drop.y += drop.vy;

            // Draw falling glossy chocolate teardrop
            ctx.save();
            ctx.fillStyle = '#240F06';
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y - drop.radius * 2);
            ctx.bezierCurveTo(
              drop.x - drop.radius * 1.3, drop.y,
              drop.x - drop.radius, drop.y + drop.radius,
              drop.x, drop.y + drop.radius
            );
            ctx.bezierCurveTo(
              drop.x + drop.radius, drop.y + drop.radius,
              drop.x + drop.radius * 1.3, drop.y,
              drop.x, drop.y - drop.radius * 2
            );
            ctx.fill();

            // Liquid gloss sheen along the edge
            ctx.fillStyle = 'rgba(255, 235, 185, 0.8)';
            ctx.beginPath();
            ctx.ellipse(
              drop.x - drop.radius * 0.3,
              drop.y,
              drop.radius * 0.28,
              drop.radius * 0.65,
              -0.15, 0, Math.PI * 2
            );
            ctx.fill();
            ctx.restore();

            // Impact with bottom chocolate pool!
            if (drop.y >= currentFloor) {
              playDripSound();

              // Spawn concentric liquid ripple rings if visible
              if (currentFloor <= h) {
                ripples.push({
                  x: drop.x,
                  y: currentFloor,
                  radius: 3,
                  maxRadius: 36,
                  alpha: 0.85
                });
              }

              // Stack the pool thicker with every drop!
              poolHeight = Math.min(50, poolHeight + 0.6);
              setDropsStacked(prev => {
                const next = prev + 1;
                if (onDropCountChange) onDropCountChange(next);
                return next;
              });

              // Reset to form next drop
              drop = {
                state: 'forming',
                t: 0,
                x: dripOrigin.x,
                y: dripOrigin.y,
                vy: 1.8,
                radius: 3,
                stretchY: 0
              };
            }
          }

          // 3. EXPANDING RIPPLE WAVES AT IMPACT POINT
          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.radius += 1.4;
            r.alpha -= 0.028;
            if (r.alpha <= 0) {
              ripples.splice(i, 1);
            } else {
              ctx.save();
              ctx.strokeStyle = `rgba(201, 148, 59, ${r.alpha})`;
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.35, 0, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }

          // 4. STACKED BOTTOM MOLTEN CHOCOLATE POOL (Strictly directly above Footer)
          if (isFooterInView) {
            ctx.save();
            const poolBaseY = footerTop;
            const poolSurfaceY = poolBaseY - poolHeight;

            const bottomGrad = ctx.createLinearGradient(0, poolSurfaceY - 18, 0, poolBaseY);
            bottomGrad.addColorStop(0, '#3E1A0C');
            bottomGrad.addColorStop(0.4, '#240F06');
            bottomGrad.addColorStop(1, '#150702');
            ctx.fillStyle = bottomGrad;

            ctx.beginPath();
            ctx.moveTo(0, poolBaseY);
            ctx.lineTo(0, poolSurfaceY);
            for (let px = 0; px <= w; px += 24) {
              const wave = Math.sin(time * 1.6 + px * 0.015) * 4.5 + Math.cos(time * 0.9 + px * 0.03) * 2;
              ctx.lineTo(px, poolSurfaceY + wave);
            }
            ctx.lineTo(w, poolBaseY);
            ctx.closePath();
            ctx.fill();

            // Golden Gloss Rim along the top surface of the pool
            ctx.strokeStyle = 'rgba(232, 191, 109, 0.85)';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            for (let px = 0; px <= w; px += 24) {
              const wave = Math.sin(time * 1.6 + px * 0.015) * 4.5 + Math.cos(time * 0.9 + px * 0.03) * 2;
              if (px === 0) ctx.moveTo(px, poolSurfaceY + wave);
              else ctx.lineTo(px, poolSurfaceY + wave);
            }
            ctx.stroke();
            ctx.restore();
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', onResize);
          window.removeEventListener('scroll', updateBadgePos);
          cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <>
          <canvas
            ref={canvasRef}
            className="fixed inset-0 pointer-events-none z-30 w-full h-full max-w-full overflow-hidden"
            style={{ width: '100vw', height: '100vh', maxWidth: '100%' }}
          />

          {/* Real-time Stacked Ganache Droplet Counter Badge (Glides above Footer) */}
          <div
            className="fixed left-3 sm:left-4 z-40 pointer-events-auto transition-[bottom] duration-150 ease-out"
            style={{ bottom: `${badgeBottom}px` }}

              <div className="text-center space-y-2 mb-10">
                <span className="font-cormorant text-xs font-bold uppercase tracking-widest text-[#8C5C1B] bg-white px-3.5 py-1 rounded-full border border-[#C9943B]/30">
                  Official Menu Card
                </span>
                <h3 className="font-serif text-3xl sm:text-4xl font-extrabold text-[#240F06]">
                  The 3 Signature Options
                </h3>
                <p className="text-xs sm:text-sm text-[#69381E]">
                  Hand-baked daily with premium Belgian couverture cocoa · 100% Pure Veg & Eggless

                        {size.illustrationType === "tin" && <IllustrationTin />}
                        {size.illustrationType === "twin" && <IllustrationTwinTins />}
                      </div>

                      {/* Middle: Details */}
                      <div className="flex-1 text-center md:text-left space-y-2">
                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-1.5 sm:gap-2">
                          <h4 className="font-serif font-bold text-xl sm:text-2xl text-[#240F06]">{size.name}</h4>
                          <span className="px-2.5 py-0.5 rounded-full bg-[#FAF5ED] border border-[#C9943B]/30 text-[10px] sm:text-[11px] font-bold text-[#8C5C1B]">
                            {size.servings}
                          </span>
                          <span className="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 text-[9px] sm:text-[10px] font-extrabold">
                            {size.badge}
                          </span>
                        </div>
                        <p className="text-xs text-gray-600 leading-relaxed max-w-lg font-light">
                          {size.description}
                        </p>
                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 text-[10px] sm:text-[11px] text-[#8C5C1B] font-semibold">
                          <span>📦 {size.packaging}</span>
                          <span>•</span>
                          <span>🌱 100% Eggless</span>
                        </div>
                      </div>

                      {/* Right: Plaque with Price & Direct Order */}
                      <div className="flex-shrink-0 flex flex-col items-center sm:items-end gap-2.5 sm:gap-3 w-full md:w-auto">
                        <div className="plaque-gold px-6 py-2.5 sm:px-8 sm:py-3 text-center w-full sm:min-w-[170px]">
                          <span className="font-serif text-2xl sm:text-3xl font-extrabold gold-foil-text block">
                            Rs. {size.price}
                          </span>
                          {size.savings && (
                            <span className="text-[10px] font-bold text-emerald-400 block -mt-0.5 sm:-mt-1">
                              {size.savings}
                            </span>
                          )}
                        </div>

                        <div className="grid grid-cols-2 gap-2 w-full">
                          <button
                            onClick={() => handleDirectWhatsAppOrder(size)}
                            className="py-3 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition-all shadow-xs flex items-center justify-center gap-1.5 min-h-[44px] active:scale-95"
                          >
                            💬 WhatsApp
                          </button>
                          <button
                            onClick={() => handleAddSizeToBag(size)}
                            className="py-3 px-3 rounded-xl bg-[#FAF5ED] hover:bg-[#F3E9DD] text-[#432111] font-bold text-xs border border-[#C9943B]/40 transition-all flex items-center justify-center gap-1.5 min-h-[44px] active:scale-95"
                          >
                            + Bag
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Bottom Script Banner (from Flyer) */}
              <div className="text-center pt-10 pb-4">
                <p className="font-script text-4xl sm:text-5xl text-[#C9943B]">
                  "Indulge in every slice of happiness!" 🤎
                </p>
              </div>

            </section>

            {/* THE ARTISAN STANDARDS (Why Matilda Cake is Special) */}

              <div className="bg-[#240F06] text-[#FAF5ED] rounded-3xl p-8 sm:p-12 border border-[#C9943B]/40 shadow-xl space-y-8">
                
                <div className="text-center space-y-2 max-w-xl mx-auto">
                  <span className="font-cormorant text-xs font-bold uppercase tracking-widest text-[#E8BF6D]">
                    The Artisan Philosophy
                  </span>
                  <h3 className="font-serif text-2xl sm:text-3xl font-bold text-[#FFF1D0]">
                    Crafted Without Compromise
                  </h3>
                  <p className="text-xs sm:text-sm text-[#FAF5ED]/75 font-light">
                    Every cake begins with honest, high-end ingredients:
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {[
                    { icon: "🍫", title: "Belgian Couverture", desc: "Pure dark chocolate and Dutch alkalized cocoa for intense, deep chocolate notes." },
                    { icon: "🧈", title: "Slow-Churned Butter", desc: "Real fresh dairy butter for a cloud-soft crumb that melts upon contact." },
                    { icon: "🌱", title: "100% Eggless Mastery", desc: "Vegetarian perfection achieved without compromising moisture or sponge density." },
                    { icon: "♨️", title: "15-Second Secret", desc: "Microwave for 15s to turn the ganache into a warm, glossy chocolate river." },
                  ].map(p => (
                    <div key={p.title} className="p-4 rounded-2xl bg-white/5 border border-white/10 space-y-2 text-center">
                      <span className="text-3xl block">{p.icon}</span>
                      <h4 className="font-serif font-bold text-sm text-[#E8BF6D]">{p.title}</h4>
                      <p className="text-[11px] text-[#FAF5ED]/70 leading-relaxed font-light">{p.desc}</p>
                    </div>
                  ))}
                </div>

              </div>
            </section>

            {/* INSTAGRAM ATELIER SECTION */}
            <section className="py-12 px-4 max-w-6xl mx-auto">
              <div className="rounded-3xl bg-white/90 backdrop-blur-sm border-2 border-[#C9943B]/30 p-8 shadow-sm flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
                <div className="space-y-2">
                  <div className="inline-flex items-center gap-2 text-xs font-bold text-purple-700">
                    <span>📷</span>
                    <span>Official Instagram Atelier</span>
                  </div>
                  <h3 className="font-serif text-2xl sm:text-3xl font-bold text-[#240F06]">
                    Follow {BRAND.instagramHandle}
                  </h3>
                  <p className="text-xs text-gray-600 max-w-md font-light">
                    Watch our daily fresh baking, warm ganache drizzles, and tag us in your sweetest celebrations to be featured!
                  </p>
                </div>

                <a
                  href={BRAND.instagramUrl}
                  target="_blank"
                  className="px-8 py-3.5 rounded-full bg-gradient-to-r from-[#833AB4] via-[#FD1D1D] to-[#F77737] text-white font-bold text-xs shadow-md hover:scale-105 active:scale-95 transition-all whitespace-nowrap flex items-center gap-2"

                  <span>Follow on Instagram →</span>
                </a>
              </div>
            </section>

            {/* FAQS */}

              <h3 className="font-serif text-2xl sm:text-3xl font-bold text-center text-[#240F06] mb-6">
                Frequently Asked Questions
              </h3>
              <div className="space-y-3">
                {[
                  { q: "Is the Matilda Chocolate Cake 100% Eggless?", a: "Yes! Our cake is 100% pure vegetarian and eggless. We achieve that rich, cloud-soft, intensely moist chocolate fudge texture through pure Belgian couverture and slow-churned butter." },
                  { q: "How does the 15-second warm ganache trick work?", a: "Warm your slice or cake tin in the microwave for 15-20 seconds before eating. The glossy ganache liquefies into a velvety warm chocolate river!" },
                  { q: "How do I place an order?", a: "Choose your portion size above and tap 'Order on WhatsApp' to send your pre-filled cart with 1 click, or DM us on Instagram @matilda.bakeluxe!" },
                  { q: "How much advance notice is needed?", a: "Each cake is freshly baked and finished to order. Please order 4 to 6 hours in advance for same-day delivery." }
                ].map(faq => (
                  <div key={faq.q} className="rounded-2xl border border-[#C9943B]/20 bg-white p-5 shadow-xs">
                    <h4 className="font-serif font-bold text-base text-[#240F06]">{faq.q}</h4>
                    <p className="text-xs text-gray-600 leading-relaxed mt-2 font-light">{faq.a}</p>
                  </div>
                ))}
              </div>
            </section>

              <div className="rounded-3xl bg-gradient-to-b from-[#2E1408] to-[#150702] border-2 border-[#C9943B] p-8 sm:p-12 text-[#FAF5ED] shadow-2xl relative overflow-hidden">
                <div className="absolute top-0 left-1/2 transform -translate-x-1/2 w-72 sm:w-96 h-36 bg-[#C9943B]/20 rounded-full blur-3xl pointer-events-none" />

                <div className="relative z-10 space-y-3">
                  <div className="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-[#3D1E0E] border border-[#C9943B]/50 text-xs font-bold text-[#E8BF6D]">
                    <span className="w-2 h-2 rounded-full bg-[#E8BF6D] animate-ping" />
                    <span>Pure Belgian Cocoa Ganache Reservoir</span>
                  </div>

                  <h3 className="font-serif text-3xl sm:text-4xl font-extrabold text-[#FFF1D0]">
                    Where Every Falling Drop Gathers
                  </h3>

                  <p className="font-cormorant text-base sm:text-lg text-[#FAF5ED]/80 max-w-xl mx-auto italic font-light">
                    "From the top corner drip to the bottom pool, every drop of molten chocolate stacks up into our signature glossy ganache bath."
                  </p>

                  <div className="pt-4 max-w-md mx-auto space-y-3">
                    <div className="p-4 rounded-2xl bg-black/40 border border-[#C9943B]/30 flex items-center justify-between text-xs">
                      <span className="text-[#E8BF6D] font-bold flex items-center gap-2">
                        <span>🍫</span>
                        <span>Continuous Chocolate Drip:</span>
                      </span>
                      <span className="px-3 py-1 rounded-full bg-[#C9943B] text-[#1E0E07] font-extrabold">
                        Active & Flowing Drop by Drop
                      </span>
                    </div>

                    <p className="text-[11px] text-[#FAF5ED]/60 font-light">
                      Watch the left side of your screen: chocolate drops continuously swell, detach, and fall slowly into the bottom pool!
                    </p>
                  </div>

                  <div className="pt-4 flex flex-wrap items-center justify-center gap-4">
                    <a
                      href="#menu"
                      className="px-8 py-3.5 rounded-full bg-[#C9943B] hover:bg-[#B3802E] text-[#1E0E07] font-extrabold text-xs sm:text-sm shadow-xl transition-all"

                      Taste The Ganache — Order Cake (From Rs. 129)
                    </a>
                    <a
                      href={`https://wa.me/${BRAND.whatsappNumber.replace(/[^0-9]/g, '')}?text=${encodeURIComponent("Hello Matilda Bakeluxe! I would like to inquire about ordering your artisanal Matilda Chocolate Cake. ✨")}`}
                      target="_blank"
                      className="px-6 py-3.5 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm shadow-md transition-all flex items-center gap-2"
                    >
                      <span>💬 Chat on WhatsApp</span>
                    </a>
                  </div>
                </div>

              </div>
            </section>

          </main>

          {/* Luxury Footer */}
          <footer id="site-footer" className="bg-[#1E0E07] text-[#FAF5ED] border-t-2 border-[#C9943B]/40 py-8 sm:py-10 px-4 mt-8 sm:mt-12 relative z-40">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-5 sm:gap-6 text-xs text-[#FAF5ED]/70 text-center sm:text-left">
              <div className="flex items-center gap-3">
                <MatildaLogo className="w-10 h-10" />
                <div className="text-left">
                  <span className="font-serif font-bold text-base text-[#FAF5ED] block">Matilda Bakeluxe</span>
                  <span className="text-[10px] text-[#C9943B]">{BRAND.tagline}</span>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-3 sm:gap-4 text-xs">
                <a href={BRAND.instagramUrl} target="_blank" className="hover:text-[#E8BF6D] transition-colors">{BRAND.instagramHandle}</a>
                <span className="hidden xs:inline">•</span>
                <button onClick={() => setIsFlyerOpen(true)} className="hover:text-[#E8BF6D] transition-colors">Menu Card Flyer</button>
                <span className="hidden xs:inline">•</span>
                <a href={`https://wa.me/${BRAND.whatsappNumber.replace(/[^0-9]/g, '')}?text=${encodeURIComponent("Hello Matilda Bakeluxe! I would like to place an order for the Matilda Chocolate Cake. ✨")}`} target="_blank" className="text-emerald-400 font-semibold">
                  WhatsApp Orders
                </a>
              </div>

              <div className="text-[11px] text-[#FAF5ED]/50 text-center sm:text-right">
                © {new Date().getFullYear()} Matilda Bakeluxe. Crafted with pure Belgian cocoa.
              </div>
            </div>
          </footer>

          {/* SLIDE-OUT SHOPPING BAG DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-black/60 backdrop-blur-xs flex justify-end">
              <div className="relative w-full max-w-md bg-white shadow-2xl flex flex-col h-full animate-slideInRight">
                
                <div className="p-5 border-b border-gray-100 flex items-center justify-between bg-[#FAF5ED]">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🛍️</span>
                    <h3 className="font-serif font-bold text-lg text-[#240F06]">Your Shopping Bag</h3>
                  </div>
                  <button onClick={() => setIsCartOpen(false)} className="p-2 text-gray-400 hover:text-gray-600">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-3">
                  {cart.length === 0 ? (
                    <div className="text-center py-20 space-y-3">
                      <span className="text-5xl block animate-bounce">🧁</span>
                      <h4 className="font-serif font-bold text-lg text-[#240F06]">Your bag is empty</h4>
                      <p className="text-xs text-gray-500">Pick a 200g Box, 500g Tin, or 1kg Bundle!</p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="p-4 rounded-2xl border border-gray-200 bg-[#FAF5ED] flex items-center justify-between">
                        <div>
                          <h4 className="font-serif font-bold text-sm text-[#240F06]">Matilda Chocolate Cake ({item.name})</h4>
                          <span className="text-xs font-bold text-[#C9943B]">Rs. {item.price * item.quantity}</span>
                          <span className="text-[10px] text-gray-500 block">Portions: {item.quantity}</span>
                        </div>
                        <button
                          onClick={() => setCart(cart.filter(i => i.id !== item.id))}
                          className="text-gray-400 hover:text-red-500 text-xs p-2"
                        >
                          🗑️
                        </button>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-5 border-t border-gray-100 bg-gray-50 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="text-xs text-gray-500 uppercase font-bold tracking-wider">Total</span>
                      <span className="font-serif text-2xl font-extrabold text-[#240F06]">Rs. {totalBagPrice}</span>
                    </div>

                    <button
                      onClick={handleCartWhatsAppCheckout}
                      className="w-full py-3.5 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md flex items-center justify-center gap-2"
                    >
                      <span>💬 Send Order via WhatsApp</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* OFFICIAL FLYER MODAL */}
          {isFlyerOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
              <div className="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden my-4">
                <div className="p-4 border-b border-gray-100 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span>📜</span>
                    <h4 className="font-serif font-bold text-base text-[#240F06]">Official Matilda Bakeluxe Menu</h4>
                  </div>
                  <button onClick={() => setIsFlyerOpen(false)} className="p-1.5 text-gray-400 hover:text-gray-600">✕</button>
                </div>

                <div className="p-4 bg-[#FAF5ED] flex items-center justify-center">
                  <img src="./assets/matilda-menu-flyer.jpg" alt="Official Menu Flyer" className="w-full max-w-sm rounded-xl shadow-lg border border-gray-200" />
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 animate-bounce">
              <div className="px-5 py-3 rounded-2xl bg-[#240F06] text-[#FAF5ED] text-xs font-semibold shadow-2xl border border-[#C9943B]">
                {toastMsg}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
